name: Build dev APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Collect dev APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/stash-player-dev.apk

      - name: Upload dev APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/stash-player-dev.apk
          if-no-files-found: error
          archive: false
          retention-days: 14
